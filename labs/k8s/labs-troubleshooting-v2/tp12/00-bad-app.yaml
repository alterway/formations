# --- MANIFESTE BOGUÉ (bad-app.yaml) ---
# Problème : L'InitContainer tente de contacter "db-postgres-svc" qui n'existe pas (le vrai Service s'appelle "db-svc").
apiVersion: v1
kind: Service
metadata:
  name: db-svc
  namespace: default
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      initContainers:
      - name: wait-for-db
        image: alpine/k8s:1.37.0
        # ERREUR : Le nom du Service interrogé ("db-postgres-svc") est incorrect
        command: ['sh', '-c', 'until nc -z -w 2 db-postgres-svc 5432; do echo waiting for db; sleep 2; done']
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80