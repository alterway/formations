# --- MANIFESTE CORRIGÉ (fixed-app.yaml) ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-custom-config
  namespace: default
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      server {
        listen 80;
        location / {
          return 200 'Config custom chargee avec succes!\n';
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-custom
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-custom
  template:
    metadata:
      labels:
        app: nginx-custom
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/nginx.conf
          # CORRECTION : Préciser subPath pour cibler la clé spécifique et la monter comme un fichier individuel
          subPath: nginx.conf
      volumes:
      - name: config-volume
        configMap:
          name: nginx-custom-config