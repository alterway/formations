# --- MANIFESTE BOGUÉ (bad-app.yaml) ---
# Problème : La sonde "readinessProbe" vérifie la route "/ready", mais NGINX ne renvoie qu'un code 404. Le Pod n'est jamais déclaré "Ready", ce qui bloque la progression du Rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: default
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            # ERREUR : La route /ready n'existe pas dans le conteneur NGINX (404 Not Found)
            path: /ready
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5