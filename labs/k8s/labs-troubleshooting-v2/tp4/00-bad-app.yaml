# --- MANIFESTE BOGUÉ (bad-app.yaml) ---
# Problème : Le sélecteur du Service contient une coquille ("app-web") qui ne correspond pas aux labels du Pod ("app: web-server").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-server
  template:
    metadata:
      labels:
        app: web-server
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    # ERREUR : Le label ne correspond pas à "app: web-server"
    app: app-web