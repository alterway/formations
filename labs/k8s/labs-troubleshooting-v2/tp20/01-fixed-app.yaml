# --- MANIFESTE CORRIGÉ (fixed-app.yaml) ---
# Correction : Passage de failurePolicy de "Fail" à "Ignore" pour ne pas bloquer les déploiements en cas d'indisponibilité du contrôleur de validation (ou déploiement du service de validation).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: strict-pod-validation
webhooks:
  - name: validate.pod.security.local
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: "Namespaced"
    clientConfig:
      service:
        name: validator-svc
        namespace: default
        path: "/validate"
        port: 443
    # CORRECTION : En cas d'échec de communication avec le Webhook, l'API Server autorise l'opération
    failurePolicy: Ignore
    sideEffects: None
    admissionReviewVersions: ["v1"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: business-app
  template:
    metadata:
      labels:
        app: business-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine