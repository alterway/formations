# --- MANIFESTE BOGUÉ (bad-app.yaml) ---
# Problème : Le HPA est configuré pour se baser sur l'utilisation du CPU, mais les conteneurs du Deployment n'ont aucune demande ("requests.cpu") définie.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoscale-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoscale-app
  template:
    metadata:
      labels:
        app: autoscale-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        # ERREUR : Pas de bloc "resources.requests" défini.
        # Le HPA ne peut pas calculer de pourcentage d'utilisation sans valeur de référence.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: autoscale-app-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: autoscale-app
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50