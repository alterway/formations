# --- MANIFESTE BOGUÉ (bad-app.yaml) ---
# Problème : La NetworkPolicy du back-end autorise uniquement les flux entrants provenant des Pods avec le label "role: frontend", or le frontend possède "app: frontend".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
      - name: api
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: default
spec:
  selector:
    app: backend-api
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-app
  template:
    metadata:
      labels:
        # NOTE : Le label du pod est "app: frontend-app"
        app: frontend-app
    spec:
      containers:
      - name: utils
        # Utilisation de l'image demandée pour éviter les soucis de licence
        image: alpine/k8s:1.37.0
        command: ["sleep", "3600"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-backend-access
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: backend-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          # ERREUR : Aucun Pod ne possède ce label, le trafic du frontend est donc "Drop"
          role: frontend
    ports:
    - protocol: TCP
      port: 80